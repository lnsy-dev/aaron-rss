name: Build and Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # One runner per OS so electron-builder builds each platform's
        # native targets (mac dmg/zip, win nsis, linux AppImage).
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build renderer bundle (webpack + icons)
        run: npm run build
      # Package only: the installers are collected as workflow artifacts and
      # published by a single job below. Letting each matrix job publish here
      # races them against each other, which creates duplicate releases with
      # only part of the assets attached.
      - name: Package
        run: npx electron-builder --publish never
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # Create the release as a draft, attach every platform's files, then
      # publish in one step so the release is never visible half-populated.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --draft
          gh release upload "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
